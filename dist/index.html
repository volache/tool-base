<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dceff2">
  <meta name="description" content="工具基地，集中尋找日常工作所需的工具與服務。">
  <title>工具基地</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="world" aria-hidden="true"></div>
  <div class="sky-wash" aria-hidden="true"></div>
  <a class="skip-link" href="#main">跳至工具入口</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="工具基地首頁"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>工具基地</strong><span class="brand-divider"></span><span class="brand-caption">讓工作，輕快一點。</span></a>
    <div class="clock" aria-label="目前時間"><time id="current-time">--:--</time><span id="current-date"></span></div>
    <div class="header-controls">
      <button id="night" class="control icon-control" aria-label="切換黑夜模式" aria-pressed="false" title="切換黑夜模式"><i data-lucide="moon" aria-hidden="true"></i></button>
      <button id="pause" class="control" aria-pressed="false"><span id="pause-icon" aria-hidden="true"><i data-lucide="pause"></i></span><span id="pause-label">暫停動畫</span></button>
      <button id="settings-toggle" class="control icon-control" aria-label="顯示設定" aria-expanded="false" aria-controls="settings"><i data-lucide="settings" aria-hidden="true"></i></button>
    </div>
  </header>

  <main id="main">
    <section class="launcher" aria-labelledby="welcome">
      <h1 id="welcome">今天，從哪個工具開始？</h1>
      <p class="intro">常用的工具，都在這裡。</p>
      <form class="search" role="search" autocomplete="off">
        <label class="sr-only" for="search">搜尋工具或用途</label>
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="search" type="search" placeholder="搜尋工具或用途" spellcheck="false" aria-controls="tool-grid">
        <button id="google-search" class="google-search" type="submit" title="以 Google 搜尋" aria-label="以 Google 搜尋">Google</button>
        <kbd aria-hidden="true">Ctrl K</kbd>
      </form>
      <div class="tools-meta"><span id="result-label">選一個工具，開始吧</span><span id="tool-count">6 個工具</span></div>
      <div id="tool-grid" class="tool-grid"></div>
      <div id="empty" class="empty" hidden><span aria-hidden="true"><i data-lucide="search-x"></i></span><h2>還沒有找到這個工具</h2><p>可改用 Google 尋找公開資訊，或換個關鍵字搜尋內部工具。</p><div class="empty-actions"><button id="google-search-empty" class="empty-action" type="button"><i data-lucide="external-link" aria-hidden="true"></i>用 Google 搜尋</button><button id="clear-search" class="empty-action" type="button"><i data-lucide="x" aria-hidden="true"></i>清除搜尋</button></div></div>
    </section>
  </main>

  <aside id="settings" class="settings" aria-labelledby="settings-title" hidden>
    <div class="settings-head"><h2 id="settings-title">讓背景剛剛好</h2><button id="settings-close" class="icon-control control" aria-label="關閉設定"><i data-lucide="x" aria-hidden="true"></i></button></div>
    <label id="quality-field" for="quality">畫質</label>
    <div class="quality-picker">
      <button id="quality" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="quality-options" aria-labelledby="quality-field quality-label"><span id="quality-label">均衡 · 建議</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
      <ul id="quality-options" role="listbox" aria-labelledby="quality-field" hidden>
        <li id="quality-balanced" role="option" aria-selected="true" data-quality="balanced"><span><strong>均衡</strong><small>清晰流暢，適合日常使用</small></span><i data-lucide="check" aria-hidden="true"></i></li>
        <li id="quality-high" role="option" aria-selected="false" data-quality="high"><span><strong>精緻</strong><small>更細緻的陰影與畫面</small></span><i data-lucide="check" aria-hidden="true"></i></li>
        <li id="quality-low" role="option" aria-selected="false" data-quality="low"><span><strong>輕量</strong><small>降低細節，節省電力</small></span><i data-lucide="check" aria-hidden="true"></i></li>
      </ul>
    </div>
    <p>選擇適合裝置的畫質。</p>
    <label class="check-row"><input type="checkbox" id="auto-biome"> 自動輪換三種環境</label>
    <div id="rotation-controls" class="rotation-controls" hidden>
      <label for="rotation-speed">輪換間隔 <output id="rotation-label" for="rotation-speed">每 30 秒</output></label>
      <input id="rotation-speed" type="range" min="10" max="120" step="5" value="30" aria-valuetext="每 30 秒切換場景">
      <div class="range-limits" aria-hidden="true"><span>10 秒</span><span>2 分鐘</span></div>
    </div>
    <p id="render-status" class="sr-only" role="status">背景載入中</p>
  </aside>

  <footer class="bottom-bar">
    <div class="footer-note"><span class="small-mark" aria-hidden="true"><i data-lucide="blocks"></i></span><span>一點童心，一起開工。</span></div>
    <div class="biome-switch" role="group" aria-label="背景環境"><button class="biome active" data-biome="grass" aria-pressed="true"><i data-lucide="trees" aria-hidden="true"></i>草原</button><button class="biome" data-biome="desert" aria-pressed="false"><i data-lucide="mountain" aria-hidden="true"></i>沙漠</button><button class="biome" data-biome="coast" aria-pressed="false"><i data-lucide="waves" aria-hidden="true"></i>海岸</button></div>
    <button id="help" class="about-link">使用說明 <i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
  </footer>

  <dialog id="tool-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close icon-control control" aria-label="關閉"><i data-lucide="x" aria-hidden="true"></i></button>
    <span class="dialog-kicker" id="dialog-kicker">工具資訊</span>
    <h2 id="dialog-title"></h2><p id="dialog-copy"></p>
    <div class="tool-notice" id="dialog-note">此工具目前未開放，請洽管理員。</div>
    <div id="demo-area"></div>
    <button class="primary" id="dialog-done" autofocus>知道了</button>
  </dialog>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
